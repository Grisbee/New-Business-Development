<title>SideQuest Taipei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;}
[hidden]{display:none!important;}
:root{
  color-scheme:dark;
  --backdrop:#0B0F0E;
  --ink:#14201F;
  --ink-2:#1C2C2A;
  --ink-3:#25403A;
  --paper:#F3F4EE;
  --paper-dim:#A9B2A4;
  --paper-faint:#6F7C74;
  --accent:#F0A93E;
  --accent-ink:#241705;
  --venue:#E1663E;
  --community:#6FA287;
  --line:rgba(243,244,238,0.10);
  --display:'Archivo',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
}
html,body{height:100%;}
body{margin:0;background:var(--backdrop);color:var(--paper);font-family:var(--body);display:flex;justify-content:center;align-items:center;padding-block:24px;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
svg{flex-shrink:0;}

.screen{position:relative;width:390px;height:min(844px,100%);background:var(--ink);display:flex;flex-direction:column;overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);}
@media (max-width:440px){
  body{padding-block:0;align-items:stretch;}
  .screen{width:100%;height:100%;border-radius:0;box-shadow:none;}
}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;flex-shrink:0;}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.logo svg{color:var(--accent);}
.city{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--paper-dim);background:var(--ink-3);padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:4px;}
.spacer{flex:1;}
.mode{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--paper-dim);}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper-dim);position:relative;}

.tab-head{padding:6px 18px 0;flex-shrink:0;}
.tab-head h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance;}

/* tags + sort toolbar */
.toolbar{display:flex;gap:8px;padding:14px 18px 6px;align-items:center;}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--ink-2);color:var(--paper-faint);}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--paper);font-family:inherit;font-size:14px;}
.searchbox input::placeholder{color:var(--paper-faint);}
.searchbox:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent);}
.tbtn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--ink-2);color:var(--paper-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tbtn.open{background:var(--ink-3);color:var(--paper);}
.tbtn.set{background:var(--accent);color:var(--accent-ink);}
.panel{margin:4px 18px 6px;padding:14px;border-radius:14px;background:var(--ink-2);display:flex;flex-direction:column;gap:10px;}
.panel-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);}
.panel-chips{display:flex;flex-wrap:wrap;gap:8px;}
.opt{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:14px;font-weight:600;color:var(--paper-dim);text-align:left;}
.opt.active{color:var(--paper);}
.opt svg{color:var(--accent);}
.active-filter{display:flex;align-items:center;gap:8px;padding:2px 18px 4px;font-size:12.5px;color:var(--paper-dim);}
.active-filter button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(240,169,62,.14);color:var(--accent);font-size:12px;font-weight:700;}
.chip{padding:7px 14px;border-radius:999px;background:var(--ink-3);color:var(--paper-dim);font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip.active{background:var(--accent);color:var(--accent-ink);}

.view{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
.list{padding:6px 18px 96px;display:flex;flex-direction:column;gap:12px;}
.list.rows{gap:0;}

.promo{padding:14px 0 4px;font-size:12.5px;color:var(--paper-faint);text-align:center;}
.promo b{color:var(--accent);font-weight:600;}

/* event cards */
.card{background:var(--ink-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;}
.card.has-img{padding:0;overflow:hidden;gap:0;}
.card.has-img .card-top,.card.has-img .card-foot{padding:14px 16px 0;}
.card.has-img .card-foot{padding-bottom:16px;}
.banner{height:150px;background-size:cover;background-position:center;position:relative;}
.banner .datebox{position:absolute;top:12px;left:12px;background:rgba(20,32,31,.88);backdrop-filter:blur(6px);}
.thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;flex-shrink:0;}
.card-top{display:flex;gap:12px;align-items:flex-start;}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:1px;}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance;}
.sub{font-size:12.5px;color:var(--paper-dim);line-height:1.4;}
.when{font-size:13.5px;font-weight:700;color:var(--accent);}
.datebox{width:50px;flex-shrink:0;border-radius:12px;background:var(--ink-3);text-align:center;padding:7px 0 6px;}
.datebox .dow{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--accent);}
.datebox .dnum{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;}
.datebox .mon{font-size:10.5px;color:var(--paper-dim);}
.card-foot{display:flex;align-items:center;gap:10px;}
.price{font-size:14px;font-weight:700;color:var(--paper);}
.muted{font-size:12px;color:var(--paper-dim);}
.btn{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ink-3);color:var(--paper);white-space:nowrap;}
.btn.primary{background:var(--accent);color:var(--accent-ink);}
.btn.on{background:rgba(111,162,135,.22);color:#9CCBB1;}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink);flex-shrink:0;}
.chatbtn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--ink-3);color:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chatbtn .badge{position:absolute;top:-4px;right:-4px;}

/* compact event rows (Mine, Calendar) */
.erow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.erow:last-child{border-bottom:none;}
.erow .eimg{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.ph{display:flex;align-items:center;justify-content:center;color:#14201F;}
.hero.ph{background-size:auto;}
.hero.ph svg{position:relative;z-index:1;opacity:.85;}
.erow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.erow .t{font-weight:700;font-size:14px;line-height:1.3;}
.erow .w{font-size:12.5px;font-weight:700;color:var(--accent);}
.erow .kind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--paper-dim);}
.kdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.kdot.public{background:var(--venue);}
.kdot.community{background:var(--community);}

/* segmented control */
.seg{display:flex;margin:14px 18px 4px;padding:4px;border-radius:12px;background:var(--ink-2);}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--paper-dim);display:flex;align-items:center;justify-content:center;gap:6px;}
.seg button.active{background:var(--ink-3);color:var(--paper);}
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--paper-faint);text-transform:uppercase;padding-top:14px;}

/* threads */
.thread{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;}
.rows .thread:last-child{border-bottom:none;}
.thread-icon{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#14201F;flex-shrink:0;}
.thread-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.thread-name{font-weight:700;font-size:14.5px;}
.preview{font-size:12.5px;color:#C7CEC2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview b{color:var(--paper-dim);font-weight:600;}
.follow{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--accent);color:var(--accent);flex-shrink:0;}
.follow.on{border-color:var(--line);color:var(--paper-faint);}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.time{font-size:11px;color:var(--paper-faint);}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.empty{padding:40px 20px;text-align:center;color:var(--paper-dim);font-size:13.5px;line-height:1.5;}

/* calendar */
.cal{margin:12px 18px 0;padding:14px 12px 12px;background:var(--ink-2);border-radius:18px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;}
.cal-head b{font-family:var(--display);font-size:16px;}
.legend{display:flex;gap:12px;font-size:11px;color:var(--paper-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--paper-faint);padding-bottom:4px;}
.day{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.day.out{color:var(--paper-faint);}
.day.today{box-shadow:inset 0 0 0 1.5px var(--paper-faint);}
.day.sel{background:var(--accent);color:var(--accent-ink);}
.dots{display:flex;gap:3px;height:6px;}
.dots i{width:6px;height:6px;border-radius:50%;}
.dots i.public{background:var(--venue);}
.dots i.community{background:var(--community);}
.dots i.going{box-shadow:0 0 0 1.5px var(--paper);}
.day.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink);}
.dayhead{font-family:var(--display);font-weight:700;font-size:17px;padding-top:18px;}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(20,32,31,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 4px calc(12px + env(safe-area-inset-bottom,0px));}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--paper-faint);padding:4px 0;position:relative;}
.nav button.active{color:var(--accent);}
.nav .nbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--venue);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.fab{position:absolute;right:18px;bottom:86px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(240,169,62,.3);}

/* event detail */
.card[data-detail],.erow[data-detail]{cursor:pointer;}
.detail{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;z-index:4;}
.detail.open{transform:none;}
.dscroll{flex:1;overflow-y:auto;min-height:0;}
.hero{height:230px;background-size:cover;background-position:center;position:relative;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,32,31,.35),transparent 35%,transparent 55%,var(--ink));}
.hero-back{position:absolute;top:14px;left:14px;z-index:1;width:38px;height:38px;border-radius:50%;background:rgba(20,32,31,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:var(--paper);}
.dbody{padding:0 18px 24px;display:flex;flex-direction:column;gap:18px;}
.dhead{display:flex;flex-direction:column;gap:6px;}
.dtag{font-size:12px;font-weight:700;color:var(--accent);}
.dbody h2{margin:0;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.2;text-wrap:balance;}
.info{display:flex;flex-direction:column;gap:12px;}
.info-row{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;}
.info-row small{display:block;font-size:12px;font-weight:500;color:var(--paper-dim);margin-top:1px;}
.info-ic{width:36px;height:36px;border-radius:10px;background:var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--paper-dim);flex-shrink:0;}
.info-ic.verified{color:var(--accent);}
.dbody p{margin:0;font-size:14px;line-height:1.55;color:#D6DBD1;}
.dsec{display:flex;flex-direction:column;gap:8px;}
.dsec h4{margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);}
.tier{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink-2);text-align:left;border:1.5px solid transparent;}
.tier.sel{border-color:var(--accent);}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--paper-faint);flex-shrink:0;}
.tier.sel .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--ink-2);}
.tier .tn{flex:1;font-weight:700;font-size:14px;}
.tier .tn small{display:block;font-weight:500;font-size:12px;color:var(--paper-dim);margin-top:1px;}
.tier .tp{font-weight:700;font-size:14px;}
.qty{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0;font-size:14px;font-weight:600;}
.stepper{display:flex;align-items:center;gap:14px;}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--ink-3);display:flex;align-items:center;justify-content:center;}
.stepper button:disabled{opacity:.35;cursor:default;}
.stepper b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums;}
.ticket-ok{padding:14px;border-radius:14px;background:rgba(111,162,135,.16);color:#CFE6D8;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.ticket-ok b{color:var(--paper);}
.person{display:flex;align-items:center;gap:12px;padding:8px 0;}
.person .n{flex:1;font-size:14px;font-weight:600;}
.person .n small{display:block;font-size:12px;color:var(--paper-dim);font-weight:500;}
.host-pill{font-size:11px;font-weight:700;color:var(--accent);background:rgba(240,169,62,.14);padding:3px 8px;border-radius:999px;}
.dbar{display:flex;align-items:center;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--ink);flex-shrink:0;}
.dbar .total{flex:1;font-size:12px;color:var(--paper-dim);}
.dbar .total b{display:block;font-size:17px;color:var(--paper);}
.btn.lg{padding:12px 20px;font-size:14px;}

/* chat */
.chat{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;z-index:5;}
.chat.open{transform:none;}
.chat-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
.chat-head .thread-icon{width:38px;height:38px;border-radius:12px;}
.chat-head .thread-icon svg{width:19px;height:19px;}
.chat-head .chimg{width:38px;height:38px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.chat-head .chimg svg{width:19px;height:19px;}
.chat-seg{margin:10px 14px 0;flex-shrink:0;}
.elist{flex:1;overflow-y:auto;padding:4px 14px 20px;}
.create-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin:10px 0 4px;border-radius:14px;border:1.5px dashed rgba(240,169,62,.45);color:var(--accent);font-size:14px;font-weight:700;}
.plusbtn{width:42px;height:42px;border-radius:50%;background:var(--ink-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* event posted as a chat message */
.evmsg{width:250px;max-width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;}
.msg.me .evmsg{border-color:rgba(240,169,62,.5);}
.evmsg .evlabel{display:flex;align-items:center;gap:6px;padding:9px 12px 0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
.evmsg .evrow{display:flex;gap:10px;padding:8px 12px 10px;align-items:center;}
.evmsg .eimg{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.evmsg .evt{font-weight:700;font-size:13.5px;line-height:1.3;color:var(--paper);}
.evmsg .evw{font-size:12px;color:var(--paper-dim);margin-top:2px;}
.evmsg .evfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--paper-dim);}
.evmsg .btn{padding:6px 12px;font-size:12px;}
/* university mode */
:root{--deadline:#E1663E;--exam:#B69CF0;--other:#6FA287;}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;}
.dots i.deadline,.kdot.deadline{background:var(--deadline);}
.dots i.exam,.kdot.exam{background:var(--exam);}
.dots i.other,.kdot.other{background:var(--other);}
.urow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.urow:last-child{border-bottom:none;}
.urow[data-team]{cursor:pointer;}
.ukind{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.urow.deadline .ukind{background:rgba(225,102,62,.18);color:#F29878;}
.urow.exam .ukind{background:rgba(182,156,240,.18);color:var(--exam);}
.urow.other .ukind{background:rgba(111,162,135,.2);color:#9CCBB1;}
.urow .body,.frow .body,.fmsg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;}
.urow .w{font-size:12px;font-weight:700;color:var(--paper-dim);}
.urow.deadline .w{color:#F29878;}
.urow.exam .w{color:var(--exam);}
.urow .t,.frow .t,.fmsg .t{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere;}
.urow .kind,.frow .kind,.fmsg .kind{font-size:12px;color:var(--paper-dim);}
.countdown{font-size:11.5px;font-weight:700;color:var(--paper-dim);background:var(--ink-2);padding:4px 9px;border-radius:999px;white-space:nowrap;}
.fbadge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:#5B6B66;flex-shrink:0;}
.fbadge.pdf{background:#D9534F;}
.fbadge.docx,.fbadge.doc{background:#3E7BD6;}
.fbadge.xlsx,.fbadge.xls,.fbadge.csv{background:#2E9A62;}
.fbadge.pptx,.fbadge.ppt{background:#E07B39;}
.fbadge.png,.fbadge.jpg,.fbadge.jpeg{background:#8A6FD1;}
.frow{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);}
.fmsg{display:flex;gap:10px;align-items:center;width:250px;max-width:100%;padding:10px 12px;border-radius:16px;background:var(--ink-2);border:1px solid var(--line);}
.fmsg .who{font-size:11px;font-weight:700;}
.msg.me .fmsg{border-color:rgba(240,169,62,.5);}
.dlmsg{width:250px;max-width:100%;padding:10px 12px 12px;border-radius:16px;background:rgba(225,102,62,.1);border:1px solid rgba(225,102,62,.35);cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.dlmsg .evlabel{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#F29878;padding-bottom:3px;}
.dlmsg .evt{font-weight:700;font-size:14px;}
.dlmsg .evw{font-size:12px;color:var(--paper-dim);}
.dlmsg .evw b{color:var(--paper);}
.field select{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--paper);font-family:inherit;font-size:14px;}
#sheet .sheet-wrap{z-index:999;}

/* create-event sheet */
.sheet-wrap{position:absolute;inset:0;background:rgba(5,8,8,.6);display:flex;align-items:flex-end;z-index:3;}
.sheet{width:100%;background:var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);}
.sheet-head{display:flex;align-items:center;gap:10px;}
.sheet-head b{flex:1;font-family:var(--display);font-size:17px;}
.sheet-head small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--paper-dim);}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--paper-dim);}
.field input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--paper);font-family:inherit;font-size:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:12px;color:var(--paper-faint);line-height:1.4;}
.chat-title{flex:1;min-width:0;}
.chat-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-title span{font-size:11.5px;color:var(--paper-dim);}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.daysep{align-self:center;font-size:11px;font-weight:600;color:var(--paper-faint);letter-spacing:.06em;padding:4px 0;}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%;}
.msg .avatar{width:26px;height:26px;font-size:10px;}
.bubble{background:var(--ink-2);padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:13.5px;line-height:1.45;}
.bubble .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px;}
.bubble .who em{font-style:normal;font-weight:600;color:var(--paper-faint);margin-left:4px;}
.bubble .t{display:block;font-size:10px;color:var(--paper-faint);margin-top:3px;text-align:right;}
.msg.me{align-self:flex-end;}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;}
.msg.me .bubble .t{color:rgba(36,23,5,.6);}
.composer{display:flex;gap:8px;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-shrink:0;}
.composer input{flex:1;min-width:0;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--paper);font-family:inherit;font-size:14px;}
.composer input::placeholder{color:var(--paper-faint);}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;}
.join-bar{padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--paper-dim);flex-shrink:0;}

.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:999px;transition:.2s;pointer-events:none;z-index:10;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){.chat,.toast,.tbtn .chev{transition:none;}}

const ev=id=>EVENTS.find(e=>e.id===id);
const goingCount=e=>e.going+(state.going.has(e.id)?1:0);
const isFull=e=>e.kind==='community'&&!state.going.has(e.id)&&e.going>=e.max;

/* ---------- tags + sort ---------- */
const PLACEHOLDER={public:'Search events or venues',community:'Search events',threads:'Search communities'};
function toolbar(key){
  const p=state.panel[key],tag=state.tag[key];
  let panel='';
  if(p==='tags')panel=`<div class="panel"><span class="panel-label">Filter by tag</span><div class="panel-chips">${['All',...TAGS[key]].map(t=>`<button class="chip${(tag||'All')===t?' active':''}" data-tag="${key}" data-val="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`;
  const hasDates=key in state.range,r=state.range[key];
  if(p==='dates'){
    const cur=r?`${r.from}|${r.to}`:'|';
    panel=`<div class="panel"><span class="panel-label">When</span>
      <div class="panel-chips">${PRESETS.map(([l,v])=>`<button class="chip${cur===v?' active':''}" data-preset="${key}" data-val="${v}">${l}</button>`).join('')}</div>
      <div class="row2"><label class="field">From<input type="date" data-range="${key}" data-end="from" min="${TODAY}" value="${r?r.from:''}"></label><label class="field">To<input type="date" data-range="${key}" data-end="to" min="${TODAY}" value="${r?r.to:''}"></label></div>
    </div>`;
  }
  const pills=[];
  if(tag&&!p)pills.push(`<button data-tag="${key}" data-val="All" aria-label="Clear tag ${esc(tag)}">${esc(tag)} ${ic('x',12,2.6)}</button>`);
  if(r&&!p)pills.push(`<button data-preset="${key}" data-val="|" aria-label="Clear dates">${dm(r.from)} – ${dm(r.to)} ${ic('x',12,2.6)}</button>`);
  const active=pills.length?`<div class="active-filter">Showing ${pills.join('')}</div>`:'';
  return `<div class="toolbar">
    <label class="searchbox">${ic('search',16)}<input id="search-${key}" data-search="${key}" type="search" autocomplete="off" placeholder="${PLACEHOLDER[key]}" value="${esc(state.q[key])}"></label>
    <button class="tbtn${p==='tags'?' open':''}${tag?' set':''}" data-panel="${key}" data-val="tags" aria-label="Tags">${ic('tag',18)}</button>
    ${hasDates?`<button class="tbtn${p==='dates'?' open':''}${r?' set':''}" data-panel="${key}" data-val="dates" aria-label="Dates">${ic('calendar',18)}</button>`:''}
  </div>${panel}${active}`;
}
// "today" in the mockup is Mon 28 Sep 2026
const PRESETS=[['Any time','|'],['This week','2026-09-28|2026-10-04'],['This weekend','2026-10-03|2026-10-04'],['Next week','2026-10-05|2026-10-11']];
const dm=iso=>{const [,m,d]=iso.split('-');return `${d}.${m}`;};
function applyTS(key,items){
  const tag=state.tag[key],q=state.q[key].trim().toLowerCase(),r=state.range[key];
  const hay=x=>[x.title,x.name,x.place,x.tag,x.host].filter(Boolean).join(' ').toLowerCase();
  const cmp=key==='threads'?(a,b)=>b.online-a.online:byDate;
  return items.filter(x=>(!tag||x.tag===tag)&&(!q||hay(x).includes(q))&&(!r||(x.date>=r.from&&x.date<=r.to))).slice().sort(cmp);
}
const noResults=`<div class="empty">No matches. Try another word, tag or date range.</div>`;

const threadOf=e=>THREADS.find(t=>t.id===e.thread)||{color:'var(--ink-3)',icon:'users',name:''};
// events created in a thread have no photo, so they borrow the thread's icon tile
function thumb(e,cls){
  if(e.img)return `<img class="${cls}" src="${IMG[e.img]}" alt="">`;
  const t=threadOf(e);
  return `<span class="${cls} ph" style="background:${t.color}">${ic(t.icon,24,2)}</span>`;
}
const datebox=e=>{const t=parse(e.date);return `<div class="datebox"><div class="dow">${DOW[t.getDay()].toUpperCase()}</div><div class="dnum">${t.getDate()}</div><div class="mon">${MON[t.getMonth()]}</div></div>`;};

function actionButtons(e){
  const on=state.going.has(e.id);
  if(on)return `<button class="chatbtn" data-chat-event="${e.id}" aria-label="Open event chat">${ic('chat',18)}${e.unread?`<span class="badge">${e.unread}</span>`:''}</button><button class="btn on" data-join="${e.id}">✓ Going</button>`;
  if(isFull(e))return `<button class="btn" data-join="${e.id}">Waitlist</button>`;
  if(e.tickets&&e.tickets.length)return `<button class="btn primary" data-detail="${e.id}">Tickets</button>`;
  return `<button class="btn primary" data-join="${e.id}">Join</button>`;
}

function renderPublic(){
  return `<div class="tab-head"><h1>Public events</h1></div>${toolbar('public')}<div class="list" id="results">${listPublic()}</div>`;
}
function listPublic(){
  const items=applyTS('public',EVENTS.filter(e=>e.kind==='public'));
  return `${items.length?'':noResults}
    ${items.map(e=>`
    <article class="card has-img" data-detail="${e.id}">
      <div class="banner" style="background-image:url(${IMG[e.img]})">${datebox(e)}</div>
      <div class="card-top"><div class="card-main">
        <h3>${esc(e.title)}</h3>
        <div class="sub">${esc(e.place)} · ${esc(e.time)}</div>
      </div></div>
      <div class="card-foot"><span class="price">${priceLabel(e.price)}</span><span class="muted">· ${goingCount(e)} going</span><span class="spacer"></span>${actionButtons(e)}</div>
    </article>`).join('')}
    <button class="promo" data-demo>Run a venue in Taipei? <b>List an event →</b></button>`;
}

function renderCommunity(){
  return `<div class="tab-head"><h1>Community events</h1></div>${toolbar('community')}<div class="list" id="results">${listCommunity()}</div>`;
}
function listCommunity(){
  const items=applyTS('community',EVENTS.filter(e=>e.kind==='community'));
  return `${items.length?'':noResults}
    ${items.map(e=>`
    <article class="card" data-detail="${e.id}">
      <div class="card-top">${thumb(e,'thumb')}
        <div class="card-main">
          <div class="when">${fmtShort(e.date)} · ${esc(e.time)}</div>
          <h3>${esc(e.title)}</h3>
          <div class="sub">${esc(e.place)}</div>
        </div>
      </div>
      <div class="card-foot">
        <span class="avatar" style="background:${e.color}" title="${esc(e.host)}">${esc(e.host.slice(0,2).toUpperCase())}</span>
        <span class="muted">${isFull(e)?'Full':`${Math.min(goingCount(e),e.max)} of ${e.max} going`}</span>
        <span class="spacer"></span>${actionButtons(e)}
      </div>
    </article>`).join('')}`;
}

/* ---------- threads ---------- */
function lastMsg(msgs){const m=msgs[msgs.length-1];return `<b>${m[0]==='me'?'You':esc(m[0])}:</b> ${typeof m[1]!=='object'?esc(m[1]):m[1].event?`posted an event · ${esc(ev(m[1].event).title)}`:m[1].file?`shared ${esc(m[1].file[0])}`:`added a deadline · ${esc(item(m[1].deadline).title)}`}`;}
function threadRow(t,mode){
  const right=mode==='mine'
    ?`<div class="side"><span class="time">${esc(t.time)}</span>${t.unread?`<span class="badge">${t.unread}</span>`:'<span style="height:20px"></span>'}</div>`
    :`<span class="follow${t.followed?' on':''}" role="button" tabindex="0" data-follow="${t.id}">${t.followed?'Following':'Follow'}</span>`;
  return `<button class="thread" data-open="${t.id}">
    <span class="thread-icon" style="background:${t.color}">${ic(t.icon,22,2)}</span>
    <span class="thread-body">
      <span class="thread-name">${esc(t.name)}</span>
      <span class="preview">${mode==='mine'?lastMsg(t.msgs):`${t.members.toLocaleString('en-US')} members · ${t.online} online`}</span>
    </span>
    ${right}
  </button>`;
}
function renderThreads(){
  const unread=THREADS.filter(t=>t.followed&&t.unread).length;
  const seg=`<div class="seg">
    <button class="${state.threadSeg==='mine'?'active':''}" data-seg="mine">My threads${unread?`<span class="badge">${unread}</span>`:''}</button>
    <button class="${state.threadSeg==='explore'?'active':''}" data-seg="explore">Explore</button>
  </div>`;
  if(state.threadSeg==='explore')
    return `<div class="tab-head"><h1>Threads</h1></div>${seg}${toolbar('threads')}<div class="list rows" id="results">${listThreads()}</div>`;
  const mine=THREADS.filter(t=>t.followed).sort((a,b)=>(b.unread>0)-(a.unread>0));
  const body=mine.length===0?`<div class="empty">You don’t follow any communities yet.<br>Open <b>Explore</b> and tap <b>Follow</b> on the ones you like.</div>`
    :mine.map(t=>threadRow(t,'mine')).join('');
  return `<div class="tab-head"><h1>Threads</h1></div>${seg}<div class="list rows">${body}</div>`;
}
function listThreads(){
  const items=applyTS('threads',THREADS);
  return items.length?items.map(t=>threadRow(t,'all')).join(''):noResults;
}
const LISTS={public:listPublic,community:listCommunity,threads:listThreads};

/* ---------- compact event row ---------- */
function erow(e,{showDate=true}={}){
  const on=state.going.has(e.id);
  const act=on
    ?`<button class="chatbtn" data-chat-event="${e.id}" aria-label="Open event chat">${ic('chat',18)}${e.unread?`<span class="badge">${e.unread}</span>`:''}</button>`
    :(isFull(e)?`<button class="btn" data-join="${e.id}">Waitlist</button>`
      :(e.tickets&&e.tickets.length?`<button class="btn primary" data-detail="${e.id}">Tickets</button>`:`<button class="btn primary" data-join="${e.id}">Join</button>`));
  return `<div class="erow" data-detail="${e.id}">${thumb(e,'eimg')}
    <div class="body">
      <span class="w">${showDate?fmtShort(e.date)+' · ':''}${esc(e.time)}</span>
      <span class="t">${esc(e.title)}</span>
      <span class="kind"><i class="kdot ${e.kind}"></i>${e.kind==='public'?'Public':'Community'} · ${esc(e.place)}</span>
    </div>${act}</div>`;
}

/* ---------- calendar ---------- */
function renderCalendar(){
  const start=new Date(2026,8,28); // Monday before Oct 1
  const cells=[];
  for(let i=0;i<35;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const evs=EVENTS.filter(e=>e.date===iso).sort(byDate);
    cells.push(`<button class="day${d.getMonth()!==9?' out':''}${iso===TODAY?' today':''}${iso===state.calDay?' sel':''}" data-day="${iso}" aria-label="${fmtShort(iso)}, ${evs.length} events">
      ${d.getDate()}<span class="dots">${evs.slice(0,3).map(e=>`<i class="${e.kind}${state.going.has(e.id)?' going':''}"></i>`).join('')}</span></button>`);
  }
  const sel=parse(state.calDay);
  const dayEvents=EVENTS.filter(e=>e.date===state.calDay).sort(byDate);
  return `<div class="tab-head"><h1>Calendar</h1></div>
  <div class="cal">
    <div class="cal-head"><b>October 2026</b><div class="legend"><span><i class="kdot public"></i>Public</span><span><i class="kdot community"></i>Community</span></div></div>
    <div class="cal-grid">${['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
  </div>
  <div class="list" style="gap:0">
    <div class="dayhead">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][sel.getDay()]}, ${sel.getDate()} ${MON[sel.getMonth()]}</div>
    ${dayEvents.length?dayEvents.map(e=>erow(e,{showDate:false})).join(''):`<div class="empty" style="padding:24px 0">Nothing planned this day yet.</div>`}
  </div>`;
}

/* ---------- mine ---------- */
function renderMine(){
  const f=state.mineFilter;
  const seg=`<div class="seg">${[['all','All'],['public','Public'],['community','Community']].map(([k,l])=>`<button class="${f===k?'active':''}" data-mseg="${k}">${l}</button>`).join('')}</div>`;
  const mine=EVENTS.filter(e=>state.going.has(e.id)&&(f==='all'||e.kind===f)).sort(byDate);
  const week=mine.filter(e=>e.date<='2026-10-04'),later=mine.filter(e=>e.date>'2026-10-04');
  const empty={all:'You haven’t joined any events yet.',public:'No public events yet. Get tickets in the <b>Public</b> tab.',community:'No community events yet. Tap <b>Join</b> in the <b>Community</b> tab.'}[f];
  const body=mine.length===0?`<div class="empty">${empty}<br>Joined events and their group chats show up here.</div>`
    :`${week.length?`<div class="section-label">This week</div>${week.map(e=>erow(e)).join('')}`:''}${later.length?`<div class="section-label">Later</div>${later.map(e=>erow(e)).join('')}`:''}`;
  return `<div class="tab-head"><h1>My events</h1></div>${seg}<div class="list rows">${body}</div>`;
}

function renderNav(){
  const badge={
    threads:THREADS.filter(t=>t.followed).reduce((a,t)=>a+t.unread,0),
    mine:EVENTS.filter(e=>state.going.has(e.id)).reduce((a,e)=>a+(e.unread||0),0),
    teams:TEAMS.reduce((a,t)=>a+t.unread,0)
  };
  nav.innerHTML=(state.uni?UNI_TABS:TABS).map(t=>`<button class="${state.tab===t.id?'active':''}" data-tab="${t.id}" aria-label="${t.label}">${ic(t.icon,22,1.9)}${t.label}${badge[t.id]?`<span class="nbadge">${badge[t.id]}</span>`:''}</button>`).join('');
}

function render(){
  const r={public:renderPublic,community:renderCommunity,threads:renderThreads,calendar:renderCalendar,mine:renderMine,teams:renderTeams,ucal:renderUniCalendar}[state.tab];

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong=iso=>{const t=parse(iso);return `${DAYS[t.getDay()]}, ${t.getDate()} ${MON[t.getMonth()]}`;};

function attendees(e){
  const n=Number(e.id.slice(1));
  const others=[...PEOPLE.slice(n*2),...PEOPLE.slice(0,n*2)].slice(0,Math.max(0,Math.min(e.going,e.max)-1));
  const list=[[e.host,e.hostTag,'host'],...others];
  if(state.going.has(e.id)&&!e.mine)list.push(['You','','me']);
  return list;
}

      bar=`<span class="total">Ticket booked<b>${goingCount(e)} going</b></span>${chatBtn}<button class="btn lg on" data-join="${e.id}">✓ Going</button>`;

      </div>`;
      bar=`<span class="total">Total<b>NT$${total.toLocaleString('en-US')}</b></span>${chatBtn}<button class="btn lg primary" data-buy="${e.id}">Buy ${t.qty>1?t.qty+' tickets':'ticket'}</button>`;
    }
  }else{

const USER_COLORS=['#8FC1E3','#E8A0BF','#F0C987','#B8D8A8','#C9B6F2','#F2A488','#7FD1C1'];
const colorFor=n=>USER_COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%USER_COLORS.length];

function eventCard(id){
  const e=ev(id),on=state.going.has(id),full=isFull(e);
  return `<div class="evmsg" data-detail="${id}">
    <div class="evlabel">${ic('calendar',13,2.2)}Event</div>
    <div class="evrow">${thumb(e,'eimg')}<div><div class="evt">${esc(e.title)}</div><div class="evw">${fmtShort(e.date)} · ${esc(e.time)}</div></div></div>
    <div class="evfoot"><span>${Math.min(goingCount(e),e.max)} of ${e.max} going</span>${on?`<button class="btn on" data-chat-event="${id}">Open chat</button>`:`<button class="btn ${full?'':'primary'}" data-join="${id}">${full?'Waitlist':'Join'}</button>`}</div>
  </div>`;
}
function fileCard([name,ext,size],u,time){
  return `<button class="fmsg" data-file>${fileBadge(ext)}<span class="body">${u?`<span class="who" style="color:${colorFor(u)}">${esc(u)}</span>`:''}<span class="t">${esc(name)}</span><span class="kind">${esc(size)} · ${esc(time)}</span></span></button>`;
}
function deadlineCard(id){
  const x=item(id);
  return `<div class="dlmsg" data-team="${x.team}" data-ttab="deadlines">
    <div class="evlabel">${ic('flag',13,2.2)}Deadline added</div>
    <div class="evt">${esc(x.title)}</div>
    <div class="evw">${fmtShort(x.date)} · ${esc(x.time)} · <b>${dueIn(x.date)}</b></div>
  </div>`;
}
function bubbles(msgs){
  return msgs.map(([u,txt,time,host])=>{
    let card=null;
    if(typeof txt==='object')card=txt.event?eventCard(txt.event):txt.file?fileCard(txt.file,u==='me'?null:u,time):deadlineCard(txt.deadline);
    if(u==='me')return card?`<div class="msg me">${card}</div>`
      :`<div class="msg me"><div class="bubble">${esc(txt)}<span class="t">${esc(time)}</span></div></div>`;
    const av=`<span class="avatar" style="background:${colorFor(u)}">${esc(u.slice(0,2).toUpperCase())}</span>`;
    return card?`<div class="msg">${av}${card}</div>`
      :`<div class="msg">${av}<div class="bubble"><span class="who" style="color:${colorFor(u)}">${esc(u)}${host?'<em>host</em>':''}</span>${esc(txt)}<span class="t">${esc(time)}</span></div></div>`;
  }).join('');
}
function composer(name,withCreate){return `<form class="composer" id="composer">${withCreate?`<button type="button" class="plusbtn" data-create aria-label="Create an event">${ic('calendar',19,2)}</button>`:''}<input id="chat-input" autocomplete="off" placeholder="Message ${esc(name)}…" aria-label="Message"><button class="send" type="submit" aria-label="Send">${ic('send',18,2.2)}</button></form>`;}

function createSheet(t){
  return `<div class="sheet-wrap" data-cancel-create><form class="sheet" id="create-form">
    <div class="sheet-head"><b>New event<small>Posted in ${esc(t.name)}</small></b><button type="button" class="icon-btn" data-cancel-create aria-label="Close">${ic('x',20,2.2)}</button></div>

function renderChat(){
  const c=state.chat;if(!c)return;
  let head,body,foot='',extra='';
  if(c.type==='thread'){
    const t=THREADS.find(x=>x.id===c.id);
    const related=EVENTS.filter(e=>e.thread===t.id).sort(byDate);
    head=`<span class="thread-icon" style="background:${t.color}">${ic(t.icon,19,2)}</span>
      <div class="chat-title"><b>${esc(t.name)}</b><span>${t.members.toLocaleString('en-US')} members</span></div>
      <button class="follow${t.followed?' on':''}" data-follow="${t.id}">${t.followed?'Following':'Follow'}</button>`;
    extra=`<div class="seg chat-seg">
      <button class="${state.chatTab==='chat'?'active':''}" data-ctab="chat">Chat</button>
      <button class="${state.chatTab==='events'?'active':''}" data-ctab="events">Related events${related.length?`<span class="badge" style="background:var(--ink-3);color:var(--paper)">${related.length}</span>`:''}</button>
    </div>`;
    if(state.chatTab==='events'){
      body=`<div class="elist">${t.followed?`<button class="create-row" data-create>${ic('plus',18,2.4)}Create an event in this thread</button>`:''}
        ${related.length?related.map(e=>erow(e)).join(''):`<div class="empty">No events yet.<br>Events created in this chat will show up here.</div>`}</div>`;
    }else{
      body=`<div class="msgs" id="msgs"><div class="daysep">TODAY</div>${bubbles(t.msgs)}</div>`;
    }
    foot=!t.followed?`<div class="join-bar"><span style="flex:1">Follow this community to join the chat.</span><button class="btn primary" data-follow="${t.id}">Follow</button></div>`
      :(state.chatTab==='chat'?composer(t.name,true):'');
    if(state.creating)foot+=createSheet(t);
  }else if(c.type==='team'){
    const t=team(c.id);
    head=`<span class="thread-icon" style="background:${t.color}">${ic(t.icon,19,2)}</span>
      <div class="chat-title"><b>${esc(t.name)}</b><span>${esc(t.course)} · ${t.members.length+1} members</span></div>`;
    const n=UNI_ITEMS.filter(x=>x.team===t.id&&x.date>=TODAY).length;
    extra=`<div class="seg chat-seg">${[['chat','Chat'],['files',`Files<span class="badge" style="background:var(--ink-3);color:var(--paper)">${t.files.length}</span>`],['deadlines',`Deadlines${n?`<span class="badge" style="background:var(--ink-3);color:var(--paper)">${n}</span>`:''}`]]
      .map(([k,l])=>`<button class="${state.teamTab===k?'active':''}" data-tt="${k}">${l}</button>`).join('')}</div>`;
    body=teamBody(t);
    foot=state.teamTab==='chat'?teamComposer(t):'';
  }else{
    const e=ev(c.id);
    head=`${thumb(e,'chimg')}
      <div class="chat-title"><b>${esc(e.title)}</b><span>${fmtShort(e.date)} · ${esc(e.time)} · ${goingCount(e)} going</span></div>`;
    body=`<div class="msgs" id="msgs"><div class="daysep">TODAY</div>${bubbles(e.chat)}</div>`;
    foot=composer('the group',false);
  }
  chat.innerHTML=`<div class="chat-head"><button class="icon-btn" data-close aria-label="Back">${ic('back',22,2.2)}</button>${head}</div>${extra}${body}${foot}`;
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
}
// overlays stack in the order they were opened (chat over detail or detail over chat)
let layer=4;
function raise(el){el.style.zIndex=++layer;}
function openChat(type,id){
  const obj=type==='thread'?THREADS.find(x=>x.id===id):type==='team'?team(id):ev(id);
  obj.unread=0;state.chat={type,id};state.chatTab='chat';state.teamTab='chat';state.creating=false;
  raise(chat);renderChat();chat.classList.add('open');chat.setAttribute('aria-hidden','false');render();
}
function closeChat(){state.chat=null;state.creating=false;chat.classList.remove('open');chat.setAttribute('aria-hidden','true');render();}

const to12h=v=>{let [h,m]=v.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`;};
let createdCount=0;
function createEvent(){
  const t=THREADS.find(x=>x.id===state.chat.id);
  const val=id=>document.getElementById(id).value.trim();
  const id='u'+(++createdCount);
  const now=new Date().toTimeString().slice(0,5);
  EVENTS.push({id,kind:'community',img:null,thread:t.id,tag:TAGS.community.includes(t.tag)?t.tag:'Outdoors',date:val('ce-date'),time:to12h(val('ce-time')),
    title:val('ce-title'),place:val('ce-place'),host:'You',hostTag:'Organizer',mine:true,color:'#F0A93E',going:0,max:Math.max(2,+val('ce-max')||8),
    desc:`Created in ${t.name}. Say hi in the event chat and ask anything.`,chat:[['me','Created this event, see you there!',now]]});
  state.going.add(id);
  t.msgs.push(['me',{event:id},now]);t.time=now;
  state.creating=false;state.chatTab='chat';
  toast('Event posted · also in Community and Calendar');
  renderChat();render();
}

function toggleFollow(id){
  const t=THREADS.find(x=>x.id===id);
  t.followed=!t.followed;
  toast(t.followed?'Added to My threads':`Unfollowed ${t.name}`);
  render();if(state.chat)renderChat();
}
function toggleJoin(id){
  const e=ev(id);
  if(state.going.has(id)){state.going.delete(id);delete state.bought[id];toast('You left this event');}
  else if(isFull(e)){toast('Added to the waitlist');return;}
  else{state.going.add(id);toast('You’re going · group chat is in My events');}
  render();if(state.chat)renderChat();
}

    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const its=UNI_ITEMS.filter(x=>x.date===iso);
    cells.push(`<button class="day${d.getMonth()!==9?' out':''}${iso===TODAY?' today':''}${iso===state.uniDay?' sel':''}" data-uday="${iso}" aria-label="${fmtShort(iso)}, ${its.length} items">
      ${d.getDate()}<span class="dots">${its.slice(0,3).map(x=>`<i class="${x.kind}"></i>`).join('')}</span></button>`);
  }
  const sel=parse(state.uniDay);
  const dayItems=UNI_ITEMS.filter(x=>x.date===state.uniDay).sort(byDate);
  return `<div class="tab-head"><h1>Calendar</h1></div>
  <div class="cal">
    <div class="cal-head"><b>October 2026</b><div class="legend"><span><i class="kdot deadline"></i>Deadline</span><span><i class="kdot exam"></i>Exam</span><span><i class="kdot other"></i>Other</span></div></div>
    <div class="cal-grid">${['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
  </div>
  <div class="list" style="gap:0">
    <div class="dayhead">${DAYS[sel.getDay()]}, ${sel.getDate()} ${MON[sel.getMonth()]}</div>
    ${dayItems.length?dayItems.map(uniRow).join(''):`<div class="empty" style="padding:24px 0">Nothing due this day.</div>`}
  </div>`;
}

function teamBody(t){
  if(state.teamTab==='files')
    return `<div class="elist">${t.files.map(([n,ext,size,by,when])=>`<button class="frow" data-file>${fileBadge(ext)}<span class="body"><span class="t">${esc(n)}</span><span class="kind">${by==='me'?'You':esc(by)} · ${esc(size)} · ${esc(when)}</span></span></button>`).join('')}</div>`;
  if(state.teamTab==='deadlines'){
    const its=UNI_ITEMS.filter(x=>x.team===t.id).sort(byDate);
    return `<div class="elist"><button class="create-row" data-add-deadline>${ic('plus',18,2.4)}Add a deadline</button>
      ${its.length?its.map(uniRow).join(''):`<div class="empty">No deadlines yet.</div>`}</div>`;
  }
  return `<div class="msgs" id="msgs"><div class="daysep">TODAY</div>${bubbles(t.msgs)}</div>`;
}
function teamComposer(t){
  return `<form class="composer" id="composer">
    <label class="plusbtn" aria-label="Attach a file" style="cursor:pointer">${ic('clip',19,2)}<input type="file" id="attach" hidden></label>
    <button type="button" class="plusbtn" data-add-deadline aria-label="Add a deadline">${ic('flag',19,2)}</button>
    <input id="chat-input" autocomplete="off" placeholder="Message ${esc(t.name)}…" aria-label="Message">
    <button class="send" type="submit" aria-label="Send">${ic('send',18,2.2)}</button></form>`;
}

/* bottom sheet shared by "add deadline" (team chat) and "add to calendar" (calendar tab) */
const sheetHost=document.getElementById('sheet');
function openSheet(s){state.sheet=s;renderSheet();const f=document.getElementById('sh-title');if(f)f.focus();}
function closeSheet(){state.sheet=null;renderSheet();}
function renderSheet(){
  const s=state.sheet;
  if(!s){sheetHost.innerHTML='';return;}
  const t=s.kind==='deadline'&&team(s.team);
  const kinds=s.kind==='cal'?`<div class="panel-chips">${['exam','deadline','other'].map(k=>`<button type="button" class="chip${s.type===k?' active':''}" data-sheet-type="${k}">${KIND_LABEL[k]}</button>`).join('')}</div>`:'';
  const course=s.kind==='cal'?`<label class="field">Course<select id="sh-course">${Object.entries(COURSES).map(([c,n])=>`<option value="${c}">${c} · ${esc(n)}</option>`).join('')}</select></label>`:'';
  const place=s.kind==='cal'?`<label class="field">Where (optional)<input id="sh-place" maxlength="50" placeholder="e.g. Engineering Hall, Room 101"></label>`:'';
  sheetHost.innerHTML=`<div class="sheet-wrap" data-close-sheet><form class="sheet" id="sheet-form">
    <div class="sheet-head"><b>${s.kind==='cal'?'Add to calendar':'New deadline'}<small>${t?`Shared with ${esc(t.name)}`:'Only visible to you'}</small></b><button type="button" class="icon-btn" data-close-sheet aria-label="Close">${ic('x',20,2.2)}</button></div>
    ${kinds}
    <label class="field">Title<input id="sh-title" required maxlength="60" placeholder="${s.kind==='cal'&&s.type==='exam'?'e.g. Calculus final':'e.g. Lab report 3'}"></label>
    ${course}
    <div class="row2"><label class="field">Date<input id="sh-date" type="date" required min="${TODAY}" value="${state.uniDay>=TODAY?state.uniDay:TODAY}"></label><label class="field">Time<input id="sh-time" type="time" required value="${s.type==='exam'?'09:00':'23:59'}"></label></div>
    ${place}
    <span class="hint">${t?'The deadline is posted in the team chat and shows up in everyone’s Calendar.':'Shows up in your Calendar.'}</span>
    <button class="btn primary lg" type="submit">${s.kind==='cal'?'Add':'Add deadline'}</button>
  </form></div>`;
}
let uniCount=0;
function saveSheet(){
  const s=state.sheet,val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const now=new Date().toTimeString().slice(0,5);
  const x={id:'n'+(++uniCount),kind:s.kind==='cal'?s.type:'deadline',title:val('sh-title'),date:val('sh-date'),time:to12h(val('sh-time'))};
  if(s.kind==='deadline'){const t=team(s.team);Object.assign(x,{team:t.id,course:t.course});t.msgs.push(['me',{deadline:x.id},now]);t.time=now;}
  else Object.assign(x,{course:val('sh-course'),place:val('sh-place')});
  UNI_ITEMS.push(x);state.uniDay=x.date;
  closeSheet();
  toast(s.kind==='deadline'?'Deadline added · also in Calendar':`${KIND_LABEL[x.kind]} added to Calendar`);
  render();if(state.chat)renderChat();
}

function setMode(uni){
  state.uni=uni;
  document.getElementById('mode-btn').setAttribute('aria-pressed',String(uni));
  document.getElementById('city').lastChild.textContent=uni?'NTU':'TAIPEI';
  if(state.chat)closeChat();
  if(state.detail)closeDetail();
  closeSheet();
  setTab(uni?'teams':'public');
}

/* ---------- events ---------- */
document.getElementById('screen').addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-panel],[data-tag],[data-follow],[data-open],[data-join],[data-chat-event],[data-day],[data-seg],[data-mseg],[data-ctab],[data-create],[data-cancel-create],[data-preset],[data-close],[data-demo],[data-fab],[data-team],[data-tt],[data-uday],[data-add-deadline],[data-close-sheet],[data-sheet-type],[data-file],[data-detail],[data-close-detail],[data-tier],[data-qty],[data-buy]');
  if(!el)return;
  const d=el.dataset;
  if(d.detail!==undefined)return openDetail(d.detail);
  if(d.closeDetail!==undefined)return closeDetail();
  if(d.tier!==undefined){state.ticket.tier=+d.tier;return renderDetail();}
  if(d.qty!==undefined){state.ticket.qty=Math.min(6,Math.max(1,state.ticket.qty+ +d.qty));return renderDetail();}
  if(d.buy!==undefined)return buy(d.buy);
  if(d.tab!==undefined)return setTab(d.tab);
  if(d.panel!==undefined){state.panel[d.panel]=state.panel[d.panel]===d.val?null:d.val;return render();}
  if(d.tag!==undefined){state.tag[d.tag]=d.val==='All'?null:d.val;state.panel[d.tag]=null;return render();}
  if(d.follow!==undefined){e.stopPropagation();return toggleFollow(d.follow);}
  if(d.open!==undefined)return openChat('thread',d.open);
  if(d.chatEvent!==undefined)return openChat('event',d.chatEvent);
  if(d.join!==undefined)return toggleJoin(d.join);
  if(d.day!==undefined){state.calDay=d.day;return render();}
  if(d.seg!==undefined){state.threadSeg=d.seg;view.scrollTop=0;return render();}
  if(d.mseg!==undefined){state.mineFilter=d.mseg;view.scrollTop=0;return render();}
  if(d.close!==undefined){closeSheet();return closeChat();}
  if(d.ctab!==undefined){state.chatTab=d.ctab;return renderChat();}
  if(d.create!==undefined){state.creating=true;renderChat();document.getElementById('ce-title').focus();return;}
  if(d.cancelCreate!==undefined){if(el.tagName==='BUTTON'||e.target===el){state.creating=false;renderChat();}return;}
  if(d.preset!==undefined){const [f,t]=d.val.split('|');state.range[d.preset]=f?{from:f,to:t}:null;state.panel[d.preset]=null;return render();}
  if(d.demo!==undefined)return toast('Not part of the demo mockup');
  if(d.fab!==undefined)return state.tab==='ucal'?openSheet({kind:'cal',type:'exam'}):toast('Not part of the demo mockup');
  if(d.team!==undefined){openChat('team',d.team);if(d.ttab){state.teamTab=d.ttab;renderChat();}return;}
  if(d.tt!==undefined){state.teamTab=d.tt;return renderChat();}
  if(d.uday!==undefined){state.uniDay=d.uday;return render();}
  if(d.addDeadline!==undefined)return openSheet({kind:'deadline',team:state.chat.id});
  if(d.closeSheet!==undefined){if(el.tagName==='BUTTON'||e.target===el)closeSheet();return;}
  if(d.sheetType!==undefined){state.sheet.type=d.sheetType;const keep=['sh-title','sh-date','sh-place'].map(i=>document.getElementById(i)?.value);renderSheet();['sh-title','sh-date','sh-place'].forEach((i,k)=>{const f=document.getElementById(i);if(f&&keep[k])f.value=keep[k];});return;}
  if(d.file!==undefined)return toast('File preview is not part of the demo');
});
sheetHost.addEventListener('submit',e=>{e.preventDefault();saveSheet();});
// attaching a real file from the device posts it to the team chat and the Files tab
chat.addEventListener('change',e=>{
  if(e.target.id!=='attach'||!e.target.files.length)return;
  const f=e.target.files[0],t=team(state.chat.id);
  const ext=(f.name.split('.').pop()||'file').toLowerCase().slice(0,4);
  const size=f.size>1048576?`${(f.size/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(f.size/1024))} KB`;
  const now=new Date().toTimeString().slice(0,5);
  t.msgs.push(['me',{file:[f.name,ext,size]},now]);t.files.unshift([f.name,ext,size,'me','Today']);t.time=now;
  renderChat();toast('File shared with the team');
});
document.getElementById('screen').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('span[data-follow]')){e.preventDefault();e.stopPropagation();toggleFollow(e.target.dataset.follow);}
});
document.getElementById('mode-btn').addEventListener('click',()=>{setMode(!state.uni);toast(state.uni?'University mode':'City mode');});
view.addEventListener('change',e=>{
  const key=e.target.dataset.range;if(!key)return;
  const r=state.range[key]||{from:'',to:''};
  r[e.target.dataset.end]=e.target.value;
  if(r.from&&!r.to)r.to=r.from;
  if(r.to&&!r.from)r.from=r.to;
  if(r.from>r.to)[r.from,r.to]=[r.to,r.from];
  state.range[key]=r.from?r:null;
  render();
});
// search re-renders only the result list so the input keeps focus
view.addEventListener('input',e=>{
  const key=e.target.dataset.search;if(!key)return;
  state.q[key]=e.target.value;
  document.getElementById('results').innerHTML=LISTS[key]();
});
chat.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='create-form')return createEvent();
  const input=document.getElementById('chat-input');const txt=input.value.trim();if(!txt)return;
  const now=new Date().toTimeString().slice(0,5);
  const c=state.chat;
  if(c.type==='thread'){const t=THREADS.find(x=>x.id===c.id);t.msgs.push(['me',txt,now]);t.time=now;}
  else if(c.type==='team'){const t=team(c.id);t.msgs.push(['me',txt,now]);t.time=now;}
  else ev(c.id).chat.push(['me',txt,now]);
  renderChat();document.getElementById('chat-input').focus();
});

const start=(location.hash||'').slice(1);
if(TABS.some(t=>t.id===start))state.tab=start;
render();
</script>
