<!-- Supabase → Authentication → Emails → "Reset password". Subject: "Reset your password". -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1C1C1E">
  <p style="font-size:20px;font-weight:800;margin:0 0 16px">Side<span style="color:#EF7393">Quest</span></p>
  <h1 style="font-size:20px;margin:0 0 8px">Reset your password</h1>
  <p style="font-size:14px;line-height:1.5;margin:0 0 16px">Here’s your code to set a new SideQuest password:</p>
  <p style="font-size:32px;font-weight:800;letter-spacing:6px;margin:0 0 16px;color:#C93B63">{{ .Token }}</p>
  <p style="font-size:12px;color:#6B6865;margin:0">The code expires in an hour. If you didn’t ask for it, ignore this email.</p>
</div>
