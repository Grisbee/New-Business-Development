<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SideQuest Taipei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SideQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;}
[hidden]{display:none!important;}
:root{
  color-scheme:dark;
  --backdrop:#0B0F0E;
  --ink:#14201F;
  --ink-2:#1C2C2A;
  --ink-3:#25403A;
  --paper:#F3F4EE;
  --paper-dim:#A9B2A4;
  --paper-faint:#6F7C74;
  --accent:#F0A93E;
  --accent-ink:#241705;
  --venue:#E1663E;
  --community:#6FA287;
  --line:rgba(243,244,238,0.10);
  --display:'Archivo',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
}
html,body{height:100%;}
body{margin:0;background:var(--backdrop);color:var(--paper);font-family:var(--body);display:flex;justify-content:center;align-items:center;padding-block:24px;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
svg{flex-shrink:0;}

.screen{position:relative;width:390px;height:min(844px,100%);background:var(--ink);display:flex;flex-direction:column;overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);}
@media (max-width:440px){
  body{padding-block:0;align-items:stretch;}
  .screen{width:100%;height:100%;border-radius:0;box-shadow:none;}
}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;flex-shrink:0;}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.logo svg{color:var(--accent);}
.city{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--paper-dim);background:var(--ink-3);padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:4px;}
.spacer{flex:1;}
.mode{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--paper-dim);}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper-dim);position:relative;}

.tab-head{padding:6px 18px 0;flex-shrink:0;}
.tab-head h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance;}

/* tags + sort toolbar */
.toolbar{display:flex;gap:8px;padding:14px 18px 6px;align-items:center;}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--ink-2);color:var(--paper-faint);}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--paper);font-family:inherit;font-size:14px;}
.searchbox input::placeholder{color:var(--paper-faint);}
.searchbox:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent);}
.tbtn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--ink-2);color:var(--paper-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tbtn.open{background:var(--ink-3);color:var(--paper);}
.tbtn.set{background:var(--accent);color:var(--accent-ink);}
.panel{margin:4px 18px 6px;padding:14px;border-radius:14px;background:var(--ink-2);display:flex;flex-direction:column;gap:10px;}
.panel-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);}
.panel-chips{display:flex;flex-wrap:wrap;gap:8px;}
.opt{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:14px;font-weight:600;color:var(--paper-dim);text-align:left;}
.opt.active{color:var(--paper);}
.opt svg{color:var(--accent);}
.active-filter{display:flex;align-items:center;gap:8px;padding:2px 18px 4px;font-size:12.5px;color:var(--paper-dim);}
.active-filter button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(240,169,62,.14);color:var(--accent);font-size:12px;font-weight:700;}
.chip{padding:7px 14px;border-radius:999px;background:var(--ink-3);color:var(--paper-dim);font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip.active{background:var(--accent);color:var(--accent-ink);}

.view{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
.list{padding:6px 18px 96px;display:flex;flex-direction:column;gap:12px;}
.list.rows{gap:0;}

.promo{padding:14px 0 4px;font-size:12.5px;color:var(--paper-faint);text-align:center;}
.promo b{color:var(--accent);font-weight:600;}

/* event cards */
.card{background:var(--ink-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;}
.card.has-img{padding:0;overflow:hidden;gap:0;}
.card.has-img .card-top,.card.has-img .card-foot{padding:14px 16px 0;}
.card.has-img .card-foot{padding-bottom:16px;}
.banner{height:150px;background-size:cover;background-position:center;position:relative;}
.banner .datebox{position:absolute;top:12px;left:12px;background:rgba(20,32,31,.88);backdrop-filter:blur(6px);}
.thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;flex-shrink:0;}
.card-top{display:flex;gap:12px;align-items:flex-start;}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:1px;}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance;}
.sub{font-size:12.5px;color:var(--paper-dim);line-height:1.4;}
.when{font-size:13.5px;font-weight:700;color:var(--accent);}
.datebox{width:50px;flex-shrink:0;border-radius:12px;background:var(--ink-3);text-align:center;padding:7px 0 6px;}
.datebox .dow{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--accent);}
.datebox .dnum{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;}
.datebox .mon{font-size:10.5px;color:var(--paper-dim);}
.card-foot{display:flex;align-items:center;gap:10px;}
.price{font-size:14px;font-weight:700;color:var(--paper);}
.muted{font-size:12px;color:var(--paper-dim);}
.btn{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ink-3);color:var(--paper);white-space:nowrap;}
.btn.primary{background:var(--accent);color:var(--accent-ink);}
.btn.on{background:rgba(111,162,135,.22);color:#9CCBB1;}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink);flex-shrink:0;}
.chatbtn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--ink-3);color:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chatbtn .badge{position:absolute;top:-4px;right:-4px;}

/* compact event rows (Mine, Calendar) */
.erow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.erow:last-child{border-bottom:none;}
.erow .eimg{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.ph{display:flex;align-items:center;justify-content:center;color:#14201F;}
.hero.ph{background-size:auto;}
.hero.ph svg{position:relative;z-index:1;opacity:.85;}
.erow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.erow .t{font-weight:700;font-size:14px;line-height:1.3;}
.erow .w{font-size:12.5px;font-weight:700;color:var(--accent);}
.erow .kind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--paper-dim);}
.kdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.kdot.public{background:var(--venue);}
.kdot.community{background:var(--community);}

/* segmented control */
.seg{display:flex;margin:14px 18px 4px;padding:4px;border-radius:12px;background:var(--ink-2);}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--paper-dim);display:flex;align-items:center;justify-content:center;gap:6px;}
.seg button.active{background:var(--ink-3);color:var(--paper);}
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--paper-faint);text-transform:uppercase;padding-top:14px;}

/* threads */
.thread{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;}
.rows .thread:last-child{border-bottom:none;}
.thread-icon{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#14201F;flex-shrink:0;}
.thread-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.thread-name{font-weight:700;font-size:14.5px;}
.preview{font-size:12.5px;color:#C7CEC2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview b{color:var(--paper-dim);font-weight:600;}
.follow{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--accent);color:var(--accent);flex-shrink:0;}
.follow.on{border-color:var(--line);color:var(--paper-faint);}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.time{font-size:11px;color:var(--paper-faint);}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.empty{padding:40px 20px;text-align:center;color:var(--paper-dim);font-size:13.5px;line-height:1.5;}

/* calendar */
.cal{margin:12px 18px 0;padding:14px 12px 12px;background:var(--ink-2);border-radius:18px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;}
.cal-head b{font-family:var(--display);font-size:16px;}
.legend{display:flex;gap:12px;font-size:11px;color:var(--paper-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--paper-faint);padding-bottom:4px;}
.day{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.day.out{color:var(--paper-faint);}
.day.today{box-shadow:inset 0 0 0 1.5px var(--paper-faint);}
.day.sel{background:var(--accent);color:var(--accent-ink);}
.dots{display:flex;gap:3px;height:6px;}
.dots i{width:6px;height:6px;border-radius:50%;}
.dots i.public{background:var(--venue);}
.dots i.community{background:var(--community);}
.dots i.going{box-shadow:0 0 0 1.5px var(--paper);}
.day.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink);}
.dayhead{font-family:var(--display);font-weight:700;font-size:17px;padding-top:18px;}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(20,32,31,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 4px calc(12px + env(safe-area-inset-bottom,0px));}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--paper-faint);padding:4px 0;position:relative;}
.nav button.active{color:var(--accent);}
.nav .nbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--venue);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.fab{position:absolute;right:18px;bottom:86px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(240,169,62,.3);}

/* event detail */
.card[data-detail],.erow[data-detail]{cursor:pointer;}
.detail{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;z-index:4;}
.detail.open{transform:none;}
.dscroll{flex:1;overflow-y:auto;min-height:0;}
.hero{height:230px;background-size:cover;background-position:center;position:relative;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,32,31,.35),transparent 35%,transparent 55%,var(--ink));}
.hero-back{position:absolute;top:14px;left:14px;z-index:1;width:38px;height:38px;border-radius:50%;background:rgba(20,32,31,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:var(--paper);}
.dbody{padding:0 18px 24px;display:flex;flex-direction:column;gap:18px;}
.dhead{display:flex;flex-direction:column;gap:6px;}
.dtag{font-size:12px;font-weight:700;color:var(--accent);}
.dbody h2{margin:0;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.2;text-wrap:balance;}
.info{display:flex;flex-direction:column;gap:12px;}
.info-row{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;}
.info-row small{display:block;font-size:12px;font-weight:500;color:var(--paper-dim);margin-top:1px;}
.info-ic{width:36px;height:36px;border-radius:10px;background:var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--paper-dim);flex-shrink:0;}
.info-ic.verified{color:var(--accent);}
.dbody p{margin:0;font-size:14px;line-height:1.55;color:#D6DBD1;}
.dsec{display:flex;flex-direction:column;gap:8px;}
.dsec h4{margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);}
.tier{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink-2);text-align:left;border:1.5px solid transparent;}
.tier.sel{border-color:var(--accent);}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--paper-faint);flex-shrink:0;}
.tier.sel .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--ink-2);}
.tier .tn{flex:1;font-weight:700;font-size:14px;}
.tier .tn small{display:block;font-weight:500;font-size:12px;color:var(--paper-dim);margin-top:1px;}
.tier .tp{font-weight:700;font-size:14px;}
.qty{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0;font-size:14px;font-weight:600;}
.stepper{display:flex;align-items:center;gap:14px;}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--ink-3);display:flex;align-items:center;justify-content:center;}
.stepper button:disabled{opacity:.35;cursor:default;}
.stepper b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums;}
.ticket-ok{padding:14px;border-radius:14px;background:rgba(111,162,135,.16);color:#CFE6D8;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.ticket-ok b{color:var(--paper);}
.person{display:flex;align-items:center;gap:12px;padding:8px 0;}
.person .n{flex:1;font-size:14px;font-weight:600;}
.person .n small{display:block;font-size:12px;color:var(--paper-dim);font-weight:500;}
.host-pill{font-size:11px;font-weight:700;color:var(--accent);background:rgba(240,169,62,.14);padding:3px 8px;border-radius:999px;}
.dbar{display:flex;align-items:center;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--ink);flex-shrink:0;}
.dbar .total{flex:1;font-size:12px;color:var(--paper-dim);}
.dbar .total b{display:block;font-size:17px;color:var(--paper);}
.btn.lg{padding:12px 20px;font-size:14px;}

/* chat */
.chat{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;z-index:5;}
.chat.open{transform:none;}
.chat-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
.chat-head .thread-icon{width:38px;height:38px;border-radius:12px;}
.chat-head .thread-icon svg{width:19px;height:19px;}
.chat-head .chimg{width:38px;height:38px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.chat-head .chimg svg{width:19px;height:19px;}
.chat-seg{margin:10px 14px 0;flex-shrink:0;}
.elist{flex:1;overflow-y:auto;padding:4px 14px 20px;}
.create-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin:10px 0 4px;border-radius:14px;border:1.5px dashed rgba(240,169,62,.45);color:var(--accent);font-size:14px;font-weight:700;}
.plusbtn{width:42px;height:42px;border-radius:50%;background:var(--ink-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* event posted as a chat message */
.evmsg{width:250px;max-width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;}
.msg.me .evmsg{border-color:rgba(240,169,62,.5);}
.evmsg .evlabel{display:flex;align-items:center;gap:6px;padding:9px 12px 0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
.evmsg .evrow{display:flex;gap:10px;padding:8px 12px 10px;align-items:center;}
.evmsg .eimg{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.evmsg .evt{font-weight:700;font-size:13.5px;line-height:1.3;color:var(--paper);}
.evmsg .evw{font-size:12px;color:var(--paper-dim);margin-top:2px;}
.evmsg .evfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--paper-dim);}
.evmsg .btn{padding:6px 12px;font-size:12px;}
/* university mode */
:root{--deadline:#E1663E;--exam:#B69CF0;--other:#6FA287;}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;}
.dots i.deadline,.kdot.deadline{background:var(--deadline);}
.dots i.exam,.kdot.exam{background:var(--exam);}
.dots i.other,.kdot.other{background:var(--other);}
.urow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.urow:last-child{border-bottom:none;}
.urow[data-team]{cursor:pointer;}
.ukind{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.urow.deadline .ukind{background:rgba(225,102,62,.18);color:#F29878;}
.urow.exam .ukind{background:rgba(182,156,240,.18);color:var(--exam);}
.urow.other .ukind{background:rgba(111,162,135,.2);color:#9CCBB1;}
.urow .body,.frow .body,.fmsg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;}
.urow .w{font-size:12px;font-weight:700;color:var(--paper-dim);}
.urow.deadline .w{color:#F29878;}
.urow.exam .w{color:var(--exam);}
.urow .t,.frow .t,.fmsg .t{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere;}
.urow .kind,.frow .kind,.fmsg .kind{font-size:12px;color:var(--paper-dim);}
.countdown{font-size:11.5px;font-weight:700;color:var(--paper-dim);background:var(--ink-2);padding:4px 9px;border-radius:999px;white-space:nowrap;}
.fbadge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:#5B6B66;flex-shrink:0;}
.fbadge.pdf{background:#D9534F;}
.fbadge.docx,.fbadge.doc{background:#3E7BD6;}
.fbadge.xlsx,.fbadge.xls,.fbadge.csv{background:#2E9A62;}
.fbadge.pptx,.fbadge.ppt{background:#E07B39;}
.fbadge.png,.fbadge.jpg,.fbadge.jpeg{background:#8A6FD1;}
.frow{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);}
.fmsg{display:flex;gap:10px;align-items:center;width:250px;max-width:100%;padding:10px 12px;border-radius:16px;background:var(--ink-2);border:1px solid var(--line);}
.fmsg .who{font-size:11px;font-weight:700;}
.msg.me .fmsg{border-color:rgba(240,169,62,.5);}
.dlmsg{width:250px;max-width:100%;padding:10px 12px 12px;border-radius:16px;background:rgba(225,102,62,.1);border:1px solid rgba(225,102,62,.35);cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.dlmsg .evlabel{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#F29878;padding-bottom:3px;}
.dlmsg .evt{font-weight:700;font-size:14px;}
.dlmsg .evw{font-size:12px;color:var(--paper-dim);}
.dlmsg .evw b{color:var(--paper);}
.field select{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--paper);font-family:inherit;font-size:14px;}
#sheet .sheet-wrap{z-index:999;}

/* create-event sheet */
.sheet-wrap{position:absolute;inset:0;background:rgba(5,8,8,.6);display:flex;align-items:flex-end;z-index:3;}
.sheet{width:100%;background:var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);}
.sheet-head{display:flex;align-items:center;gap:10px;}
.sheet-head b{flex:1;font-family:var(--display);font-size:17px;}
.sheet-head small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--paper-dim);}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--paper-dim);}
.field input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--paper);font-family:inherit;font-size:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:12px;color:var(--paper-faint);line-height:1.4;}
.chat-title{flex:1;min-width:0;}
.chat-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-title span{font-size:11.5px;color:var(--paper-dim);}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.daysep{align-self:center;font-size:11px;font-weight:600;color:var(--paper-faint);letter-spacing:.06em;padding:4px 0;}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%;}
.msg .avatar{width:26px;height:26px;font-size:10px;}
.bubble{background:var(--ink-2);padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:13.5px;line-height:1.45;}
.bubble .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px;}
.bubble .who em{font-style:normal;font-weight:600;color:var(--paper-faint);margin-left:4px;}
.bubble .t{display:block;font-size:10px;color:var(--paper-faint);margin-top:3px;text-align:right;}
.msg.me{align-self:flex-end;}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;}
.msg.me .bubble .t{color:rgba(36,23,5,.6);}
.composer{display:flex;gap:8px;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-shrink:0;}
.composer input{flex:1;min-width:0;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--paper);font-family:inherit;font-size:14px;}
.composer input::placeholder{color:var(--paper-faint);}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;}
.join-bar{padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--paper-dim);flex-shrink:0;}

.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:999px;transition:.2s;pointer-events:none;z-index:10;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){.chat,.toast,.tbtn .chev{transition:none;}}

/* app additions */
.mnav{display:flex;align-items:center;gap:2px;}
.mnav .icon-btn{width:30px;height:30px;}
.me-btn{width:34px;height:34px;border-radius:50%;background:var(--ink-3);color:var(--paper);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
/* the University switch shows only its icon so the profile button fits; its state is clear from the colour and the city pill */
.mode{padding:7px 9px;}
.mode .mtxt{display:none;}
.login{position:absolute;inset:0;z-index:2000;background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));}
.login .logo{font-size:30px;}
.login .logo svg{width:32px;height:32px;}
.login p{margin:0 0 12px;color:var(--paper-dim);font-size:14px;line-height:1.5;}
.login .err{color:var(--venue);font-size:13px;min-height:18px;}
.login button[disabled]{opacity:.6;}
.sheet .btn.lg{display:flex;align-items:center;justify-content:center;gap:8px;}
@media (max-width:440px){body{height:100dvh;}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <header class="topbar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.3" r=".6" fill="currentColor"/></svg>
      SideQuest
    </div>
    <span class="city" id="city"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>TAIPEI</span>
    <span class="spacer"></span>
    <button class="mode" id="mode-btn" aria-pressed="false" aria-label="University mode" title="University mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg><span class="mtxt">University</span></button>
    <button class="me-btn" id="me-btn" data-me aria-label="Profile"></button>
  </header>

  <main class="view" id="view"></main>

  <button class="fab" id="fab" aria-label="Create" data-fab><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="nav" id="nav"></nav>

  <section class="detail" id="detail" aria-hidden="true"></section>
  <section class="chat" id="chat" aria-hidden="true"></section>
  <div id="sheet"></div>
  <div class="toast" id="toast" role="status"></div>
  <form class="login" id="login" hidden>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.3" r=".6" fill="currentColor"/></svg>SideQuest</div>
    <p>Find something to do in Taipei tonight, and people to do it with.</p>
    <label class="field">Nickname<input id="lg-nick" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="field">Password<input id="lg-pass" type="password" required autocomplete="current-password"></label>
    <span class="err" id="lg-err" role="alert"></span>
    <button class="btn primary lg" type="submit">Log in</button>
  </form>
</div>

<!-- Event photos as data URIs (const IMG). Credits in CREDITS.md -->
<script src="img.js"></script>
<script src="icons.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
